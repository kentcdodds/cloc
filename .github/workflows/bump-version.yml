name: Bump Version
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Always the bump workspace HEAD: new bump commit when one was made,
      # otherwise the checkout SHA. Publish pins to this so a later push on
      # the branch cannot change which package.json this run publishes.
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Bump Version
        id: bump
        # No continue-on-error: "Already up to date" exits 0 from the script.
        # Any other bump failure fails this job and blocks publish.
        run: |
          npm run bump-version
          npm install --package-lock-only

      - name: Commit changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "committed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump cloc version"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.committed == '1'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Record HEAD for publish
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: bump
    # Runs after a successful bump job, including no-op bumps ("Already up to
    # date" exits 0). That retries publish for a version that failed to ship
    # earlier without waiting for a new upstream release. Real bump failures
    # fail the bump job and skip this job.
    if: needs.bump.result == 'success' && needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Pin to the bump job HEAD (new commit or no-op checkout SHA), not
          # the moving branch tip, so this run only publishes that revision.
          ref: ${{ needs.bump.outputs.sha }}

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: npm ci

      - name: Publish package
        # The version carries a `-cloc` suffix, which npm treats as a semver
        # prerelease. npm requires an explicit --tag for prerelease versions,
        # so publish it under the `latest` dist-tag. lib/ is gitignored, so
        # download the upstream script before packing.
        #
        # Override GITHUB_SHA so npm provenance names the commit we checked out
        # (bump output), not the workflow-trigger SHA. Without this, a bump that
        # creates a commit would attest the pre-bump revision.
        env:
          GITHUB_SHA: ${{ needs.bump.outputs.sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cloc@${VERSION}" version >/dev/null 2>&1; then
            echo "cloc@${VERSION} is already published; skipping"
            exit 0
          fi
          npm run download-cloc
          test -x lib/cloc
          npm pack --dry-run 2>&1 | grep -F 'lib/cloc'
          npm publish --provenance --tag latest
