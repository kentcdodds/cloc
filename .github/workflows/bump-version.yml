name: Bump Version
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Always the bump workspace HEAD: new bump commit when one was made,
      # otherwise the checkout SHA. Publish pins to this so a later push on
      # the branch cannot change which package.json this run publishes.
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Bump Version
        id: bump
        continue-on-error: true
        run: |
          npm run bump-version
          npm install --package-lock-only

      - name: Commit changes
        id: commit
        if: steps.bump.outcome == 'success' && steps.bump.conclusion == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "committed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump cloc version"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.bump.outcome == 'success' && steps.bump.conclusion == 'success' && steps.commit.outputs.committed == '1'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Record HEAD for publish
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: bump
    # Run after a successful bump job even when the bump step was a no-op
    # (continue-on-error + exit 1 "Already up to date"). That lets a failed
    # prior publish be retried on the next schedule/dispatch without waiting
    # for a new upstream version.
    if: always() && needs.bump.result == 'success' && needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Pin to the bump job HEAD (new commit or no-op checkout SHA), not
          # the moving branch tip, so this run only publishes that revision.
          ref: ${{ needs.bump.outputs.sha }}

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: npm ci

      - name: Publish package
        # The version carries a `-cloc` suffix, which npm treats as a semver
        # prerelease. npm requires an explicit --tag for prerelease versions,
        # so publish it under the `latest` dist-tag. lib/ is gitignored, so
        # download the upstream script before packing.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cloc@${VERSION}" version >/dev/null 2>&1; then
            echo "cloc@${VERSION} is already published; skipping"
            exit 0
          fi
          npm run download-cloc
          test -x lib/cloc
          npm pack --dry-run 2>&1 | grep -F 'lib/cloc'
          npm publish --provenance --tag latest
